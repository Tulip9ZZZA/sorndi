<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SornDi — the local-first teacher OS. Plan lessons, take attendance, run quizzes and export your classroom record. One file, no account, no server.">
<meta name="theme-color" content="#FAF9F6">
<title>SornDi — Teacher OS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%2236%2044%20184%20184%22%3E%3Cpath%20d%3D%22M196%2074%20H104%20A32%2032%200%200%200%20104%20138%20H152%20A32%2032%200%200%201%20152%20202%20H60%22%20fill%3D%22none%22%20stroke%3D%22%231F6E4E%22%20stroke-width%3D%2252%22%2F%3E%3C%2Fsvg%3E">
<style>
/* SORNDI design system - warm paper ledger, one green accent, hairline rules. */

:root {
  --paper: #FAF9F6;
  --subtle: #F2F0EB;
  --raised: #FFFFFF;
  --ink: #1C1915;
  --ink-2: #57534B;
  --ink-3: #7A7468;
  --line: #E6E3DC;
  --line-strong: #8A8479;
  --accent: #1F6E4E;
  --accent-ink: #175A3E;
  --accent-tint: #EAF2EE;
  --red: #B3403A;      --red-tint: #F7ECEB;
  --amber: #9A6B15;    --amber-tint: #F6F0E2;
  --slate: #4A6B8A;    --slate-tint: #EBF0F5;
  --clay: #A8552F;     --clay-tint: #F6EDE7;
  --teal: #2E7D74;     --teal-tint: #E8F1F0;
  --shadow: 0 8px 28px rgba(28, 25, 21, 0.10);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  --font-serif: Georgia, "Times New Roman", "Noto Serif Thai", serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Noto Sans Mono", monospace;
}

[data-theme="dark"] {
  --paper: #14120F;
  --subtle: #1B1915;
  --raised: #201D18;
  --ink: #F4F2ED;
  --ink-2: #B5AFA4;
  --ink-3: #8B8478;
  --line: #2E2B25;
  --line-strong: #55504A;
  --accent: #2E7D58;
  --accent-ink: #4FB084;
  --accent-tint: #1D2B24;
  --red: #C96B62;      --red-tint: #2A1D1B;
  --amber: #C09450;    --amber-tint: #2A241A;
  --slate: #7C99B5;    --slate-tint: #1C232B;
  --clay: #C4794F;     --clay-tint: #2A211B;
  --teal: #5AA79D;     --teal-tint: #1A2725;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-tint); color: var(--accent-ink); }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 500; letter-spacing: -0.01em; }
p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--subtle);
  border-right: 1px solid var(--line);
  padding: 20px 12px 20px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.brand svg.mark { width: 26px; height: 26px; }
.brand .name { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
.brand .sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); display: block; margin-top: 1px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-sm);
  color: var(--ink-2); cursor: pointer; border: 0; background: none;
  width: 100%; text-align: left; position: relative;
  transition: background 0.12s ease, color 0.12s ease;
}
.nav-item:hover { background: rgba(28, 25, 21, 0.05); color: var(--ink); }
[data-theme="dark"] .nav-item:hover { background: rgba(244, 242, 237, 0.06); }
.nav-item.active { background: var(--raised); color: var(--ink); font-weight: 500; }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--accent); border-radius: 0 2px 2px 0;
}
.nav-item svg { width: 16px; height: 16px; flex: none; }
.nav-section { font-size: 11px; color: var(--ink-3); padding: 18px 10px 4px; }
.sidebar .foot { margin-top: auto; padding: 14px 10px 0; font-size: 11px; color: var(--ink-3); }

.main { min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 28px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--paper); z-index: 30;
}
.topbar .crumb { font-size: 13px; color: var(--ink-3); }
.topbar .crumb b { color: var(--ink); font-weight: 500; }
.topbar .spacer { flex: 1; }
.content { padding: 28px; max-width: 1200px; }

/* ---------------------------------------------------------------- type */
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.page-sub { color: var(--ink-2); margin-top: 4px; max-width: 60ch; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }
.muted { color: var(--ink-3); }
.meta { font-size: 12px; color: var(--ink-3); }
.small { font-size: 12.5px; }

/* ---------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--raised);
  font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  white-space: nowrap;
}
.btn:hover { border-color: var(--line-strong); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--red); border-color: var(--line); }
.btn.danger:hover { border-color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--subtle); border-color: transparent; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; gap: 5px; }
.btn.sm svg { width: 13px; height: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--r-sm);
  border: 0; background: none; cursor: pointer; color: var(--ink-2);
  transition: background 0.12s ease, color 0.12s ease;
}
.iconbtn:hover { background: var(--subtle); color: var(--ink); }
.iconbtn svg { width: 16px; height: 16px; }

/* ---------------------------------------------------------------- forms */
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; color: var(--ink-2); }
.input, select.input, textarea.input {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--raised); color: var(--ink); font: inherit;
  transition: border-color 0.12s ease;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
textarea.input { resize: vertical; min-height: 64px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }

/* ---------------------------------------------------------------- cards, panels */
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); }
.card.pad { padding: 20px; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 16px; font-weight: 600; }
.section-head .tab-glyph { width: 10px; height: 12px; flex: none; align-self: center; }
.section-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.section-head .right { margin-left: auto; display: flex; gap: 8px; }

.stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px; min-width: 130px; }
.stat .n { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------------------------------------------------------------- chips & statuses */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 500;
  background: var(--subtle); color: var(--ink-2); border: 1px solid var(--line);
}
.chip .dot { width: 6px; height: 6px; border-radius: 2px; background: var(--ink-3); }
.chip.green { background: var(--accent-tint); color: var(--accent-ink); border-color: transparent; }
.chip.green .dot { background: var(--accent-ink); }
.chip.red { background: var(--red-tint); color: var(--red); border-color: transparent; }
.chip.amber { background: var(--amber-tint); color: var(--amber); border-color: transparent; }
.chip.slate { background: var(--slate-tint); color: var(--slate); border-color: transparent; }
.chip.clay { background: var(--clay-tint); color: var(--clay); border-color: transparent; }
.chip.teal { background: var(--teal-tint); color: var(--teal); border-color: transparent; }
.chip.mut { background: var(--subtle); color: var(--ink-3); }

/* attendance status buttons */
.status-btns { display: flex; gap: 3px; flex-wrap: wrap; }
.st-btn {
  padding: 3px 8px; font-size: 11.5px; font-weight: 500;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--raised); color: var(--ink-3); cursor: pointer;
  transition: all 0.1s ease; white-space: nowrap;
}
.st-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.st-btn.on.green { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-ink); }
.st-btn.on.red { background: var(--red-tint); color: var(--red); border-color: var(--red); }
.st-btn.on.amber { background: var(--amber-tint); color: var(--amber); border-color: var(--amber); }
.st-btn.on.slate { background: var(--slate-tint); color: var(--slate); border-color: var(--slate); }
.st-btn.on.clay { background: var(--clay-tint); color: var(--clay); border-color: var(--clay); }
.st-btn.on.teal { background: var(--teal-tint); color: var(--teal); border-color: var(--teal); }
.st-btn.on.mut { background: var(--subtle); color: var(--ink); border-color: var(--line-strong); }

/* ---------------------------------------------------------------- tables */
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th {
  text-align: left; font-size: 11.5px; font-weight: 500; color: var(--ink-3);
  padding: 8px 10px; border-bottom: 1px solid var(--line);
  background: var(--subtle); position: sticky; top: 0; z-index: 5;
}
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--subtle); }
.table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table .actions { text-align: right; white-space: nowrap; }

/* ---------------------------------------------------------------- tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tab {
  padding: 8px 14px; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  background: none; border: 0; cursor: pointer; position: relative; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); }
.tab.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
  background: var(--accent); border-radius: 2px 2px 0 0;
}

/* ---------------------------------------------------------------- dialogs */
.overlay {
  position: fixed; inset: 0; background: rgba(20, 18, 15, 0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 8vh 16px 16px; z-index: 100; animation: fadeIn 0.15s ease;
}
.dialog {
  background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); width: 100%; max-width: 520px; max-height: 84vh;
  display: flex; flex-direction: column; animation: rise 0.18s ease;
}
.dialog.wide { max-width: 760px; }
.dialog-head { display: flex; align-items: center; padding: 16px 20px 0; }
.dialog-head h3 { font-size: 16px; font-weight: 600; }
.dialog-head .iconbtn { margin-left: auto; }
.dialog-body { padding: 16px 20px; overflow-y: auto; }
.dialog-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 20px 16px; }

/* ---------------------------------------------------------------- toasts */
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px;
  font-size: 13px; box-shadow: var(--shadow); animation: rise 0.2s ease;
}
.toast.error { background: var(--red); color: #fff; }

/* ---------------------------------------------------------------- misc */
.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }
.empty svg { width: 28px; height: 28px; margin: 0 auto 12px; color: var(--line-strong); }
.empty .t { font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }
.empty .btn { margin-top: 16px; }
.kbd {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
  background: var(--subtle); color: var(--ink-2);
}
.warn {
  display: flex; gap: 8px; align-items: flex-start;
  background: var(--amber-tint); color: var(--amber);
  border: 1px solid transparent; border-radius: var(--r-sm);
  padding: 8px 12px; font-size: 12.5px;
}
.warn svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
.note {
  font-size: 12px; color: var(--ink-3); background: var(--subtle);
  border-left: 2px solid var(--line-strong); padding: 6px 10px; border-radius: 0 6px 6px 0;
}
.formula {
  font-family: var(--font-mono); font-size: 12px; background: var(--subtle);
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px;
  overflow-x: auto; white-space: pre; line-height: 1.7;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.class-card { padding: 18px; cursor: pointer; transition: border-color 0.12s ease; }
.class-card:hover { border-color: var(--line-strong); }
.class-card .name { font-weight: 600; font-size: 15px; }
.class-card .meta-line { margin-top: 2px; }
.class-card .foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.class-card .tab-mark { position: absolute; }

.attendance-summary { display: flex; gap: 6px; flex-wrap: wrap; }

/* quiz runner */
.quiz-stage { max-width: 880px; margin: 0 auto; }
.quiz-q { font-size: 24px; font-weight: 500; line-height: 1.35; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
.quiz-opt {
  text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--raised); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; gap: 12px; transition: border-color 0.12s ease;
}
.quiz-opt:hover { border-color: var(--line-strong); }
.quiz-opt .key {
  width: 26px; height: 26px; border-radius: 6px; background: var(--subtle);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; flex: none;
}
.quiz-opt .tally { margin-left: auto; font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
.quiz-opt.correct { border-color: var(--accent); background: var(--accent-tint); }
.timer-bar { height: 6px; border-radius: 3px; background: var(--subtle); overflow: hidden; }
.timer-bar > div { height: 100%; background: var(--accent); transition: width 0.5s linear; }
.big-count { font-family: var(--font-mono); font-size: 56px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* pick / timer tools */
.pick-name { font-size: 34px; font-weight: 600; text-align: center; padding: 28px 8px; min-height: 100px; }

/* print */
@media print {
  .sidebar, .topbar, #toasts, .no-print { display: none !important; }
  .app { grid-template-columns: 1fr; }
  .content { padding: 0; max-width: none; }
  body { background: #fff; color: #000; font-size: 12px; }
  .card { border-color: #ccc; box-shadow: none; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

/* entrance motion - one short rise, staggered on cards */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.view { animation: rise 0.18s ease; }

/* responsive */
@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto;
    flex-direction: row; padding: 6px 8px; border-right: 0; border-top: 1px solid var(--line);
    overflow-x: auto; z-index: 50; gap: 2px;
  }
  .brand, .nav-section, .sidebar .foot { display: none; }
  .nav-item { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 10px; }
  .nav-item.active::before { left: 8px; right: 8px; top: 0; bottom: auto; width: auto; height: 3px; border-radius: 0 0 2px 2px; }
  .main { padding-bottom: 64px; }
  .content { padding: 20px 16px; }
  .topbar { padding: 10px 16px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .quiz-opts { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="main">
    <div class="topbar">
      <span class="crumb" id="crumb"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="langbtn" aria-label="Switch language"></button>
      <button class="iconbtn" id="themebtn" aria-label="Toggle theme"></button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
/* SORNDI core domain logic — pure functions, no DOM, no storage.
   Inlined into index.html at build time; imported by tests/run-tests.mjs. */

const ATTENDANCE_STATUSES = [
  { id: "present", key: "st.present", tone: "green" },
  { id: "late", key: "st.late", tone: "amber" },
  { id: "absent_excused", key: "st.absentExcused", tone: "slate" },
  { id: "absent_unexcused", key: "st.absentUnexcused", tone: "red" },
  { id: "sick", key: "st.sick", tone: "clay" },
  { id: "left_early", key: "st.leftEarly", tone: "mut" },
  { id: "remote", key: "st.remote", tone: "teal" },
  { id: "other", key: "st.other", tone: "mut" },
];

const LESSON_TEMPLATES = [
  {
    id: "retrieval",
    key: "tpl.retrieval",
    stages: [
      { name: "Retrieval starter", minutes: 8, note: "Recall of prior objectives, no notes" },
      { name: "Review and correct", minutes: 5, note: "Feedback on the starter" },
      { name: "New content", minutes: 12, note: "Input with worked examples" },
      { name: "Guided practice", minutes: 12, note: "Teacher circulates, checks" },
      { name: "Independent practice", minutes: 10, note: "Solo work" },
      { name: "Exit check", minutes: 3, note: "One question, all answer" },
    ],
  },
  {
    id: "worked_example",
    key: "tpl.workedExample",
    stages: [
      { name: "Worked example", minutes: 10, note: "Model the thinking aloud" },
      { name: "Guided practice", minutes: 15, note: "Completion problems" },
      { name: "Independent practice", minutes: 15, note: "Fading support" },
      { name: "Exit check", minutes: 5, note: "Evidence of the objective" },
    ],
  },
  {
    id: "discussion",
    key: "tpl.discussion",
    stages: [
      { name: "Prediction", minutes: 5, note: "Commit before reveal" },
      { name: "Pair discussion", minutes: 10, note: "Argue from evidence" },
      { name: "Compare and error analysis", minutes: 15, note: "Contrast solutions" },
      { name: "Consolidation", minutes: 10, note: "Summarise the rule" },
    ],
  },
  {
    id: "task",
    key: "tpl.task",
    stages: [
      { name: "Task brief", minutes: 10, note: "Goal, roles, success criteria" },
      { name: "Team work", minutes: 25, note: "Teacher checks in per team" },
      { name: "Share and feedback", minutes: 10, note: "Two stars and a step" },

    ],

];

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

/* ------------------------------------------------------------- gradebook
   Score values: number (0..max), "missing", "excused", or null (not entered).
   Missing and excused are never counted as zero: they are excluded from both
   the sum and the weight denominator, and reported separately. */

function scoreIsNumber(v) {
  return typeof v === "number" && isFinite(v);
}

function assessmentStats(scores, maxScore) {
  let recorded = 0, missing = 0, excused = 0, unentered = 0, sum = 0;
  for (const v of scores) {
    if (v === null || v === undefined) { unentered++; continue; }
    if (v === "missing") { missing++; continue; }
    if (v === "excused") { excused++; continue; }
    if (scoreIsNumber(v)) { recorded++; sum += v; }
  }
  const average = recorded > 0 ? sum / recorded / maxScore * 100 : null;
  return { recorded, missing, excused, unentered, sum, average };
}

/* Weighted total per student.
   assessments: [{id, maxScore, weight}]
   getScore(assessmentId, studentId) -> value
   Returns { total, included: [{assessmentId, pct, weight, contribution}], missing, excused, weightSum }
   total is null when no numeric scores exist. */
function weightedTotal(assessments, studentId, getScore) {
  const included = [];
  let weightSum = 0, weightedSum = 0, missing = 0, excused = 0;
  for (const a of assessments) {
    const v = getScore(a.id, studentId);
    if (v === "missing") { missing++; continue; }
    if (v === "excused") { excused++; continue; }
    if (!scoreIsNumber(v)) continue;
    if (v < 0 || v > a.maxScore) continue; // out-of-range scores are ignored, never invented
    const pct = v / a.maxScore * 100;
    included.push({ assessmentId: a.id, pct, weight: a.weight, contribution: pct * a.weight });
    weightSum += a.weight;
    weightedSum += pct * a.weight;
  }
  const total = weightSum > 0 ? weightedSum / weightSum : null;
  return { total, included, missing, excused, weightSum };
}

function weightSumOf(assessments) {
  return assessments.reduce((s, a) => s + (Number(a.weight) || 0), 0);
}

/* ------------------------------------------------------------- attendance */

function attendanceSummary(records) {
  // records: [{status}] with status null/undefined meaning not recorded
  const counts = { not_recorded: 0 };
  for (const s of ATTENDANCE_STATUSES) counts[s.id] = 0;
  for (const r of records) {
    const k = r && r.status && counts[r.status] !== undefined ? r.status : "not_recorded";
    counts[k]++;
  }
  return counts;
}

function attendanceRate(records) {
  // Share of explicitly recorded, in-room-or-remote attendance over all recorded rows.
  const counted = records.filter(r => r && r.status);
  if (counted.length === 0) return null;
  const ok = counted.filter(r => r.status === "present" || r.status === "remote").length;
  return Math.round(ok / counted.length * 1000) / 10;
}

/* ------------------------------------------------------------- lesson plan */

function templateStages(templateId) {
  const t = LESSON_TEMPLATES.find(t => t.id === templateId);
  return t ? t.stages.map(s => ({ ...s })) : null;
}

function planTotalMinutes(stages) {
  return (stages || []).reduce((s, st) => s + (Number(st.minutes) || 0), 0);
}

function planWarnings(stages, slotMinutes, hasObjective) {
  const warns = [];
  if (!hasObjective) warns.push("no_objective");
  const total = planTotalMinutes(stages);
  if (slotMinutes && total > slotMinutes) warns.push("over_time");
  if (total === 0) warns.push("no_stages");
  return warns;
}

/* ------------------------------------------------------------- CSV / data */

function csvEscape(v) {
  const s = String(v ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(headers, rows) {
  return [headers.map(csvEscape).join(",")]
    .concat(rows.map(r => r.map(csvEscape).join(",")))
    .join("\r\n");
}

function todayISO(d = new Date()) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function weekdayIndex(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).getDay(); // 0 = Sunday
}

window.SorndiCore = { ATTENDANCE_STATUSES, LESSON_TEMPLATES, uid, scoreIsNumber, assessmentStats, weightedTotal, weightSumOf, attendanceSummary, attendanceRate, templateStages, planTotalMinutes, planWarnings, csvEscape, toCSV, todayISO, weekdayIndex };

let LANG = "en";
function t(key) {
  return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
}
function setLang(l) {
  LANG = l === "th" ? "th" : "en";
  document.documentElement.lang = LANG === "th" ? "th" : "en";
}

const WEEKDAYS = {
  en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
  th: ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"],
};
const WEEKDAYS_SHORT = {
  en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
  th: ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."],
};
const MONTHS = {
  en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
  th: ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"],
};

function fmtDateISO(iso, opts) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const wd = WEEKDAYS[LANG][new Date(y, m - 1, d).getDay()];
  if (opts && opts.long) {
    const year = LANG === "th" ? y + 543 : y;
    return LANG === "th"
      ? `${wd} ${d} ${MONTHS.th[m - 1]} ${year}`
      : `${wd} ${d} ${MONTHS.en[m - 1]} ${y}`;
  }
  const year = LANG === "th" ? y + 543 : y;
  return LANG === "th" ? `${d}/${m}/${year}` : `${d} ${MONTHS.en[m - 1].slice(0, 3)} ${y}`;
}
function fmtDateObj(d) {
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return fmtDateISO(iso, { long: true });
}

/* ---------------------------------------------------------------- state */
const STORE_KEY = "sorndi.v2";

function defaultState() {
  return {
    version: 2,
    settings: { lang: "en", theme: "system", teacherName: "", school: "" },
    classes: [], students: [], objectives: [], lessons: [], sessions: [],
    attendance: [], assessments: [], scores: [], recordTemplates: [], recordEntries: [],
    quizzes: [], quizRuns: [],
  };
}

let db = defaultState();
let saveTimer = null;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      db = Object.assign(defaultState(), parsed);
      db.settings = Object.assign({ lang: "en", theme: "system", teacherName: "", school: "" }, parsed.settings);
    }
  } catch (e) {
    console.warn("SornDi: could not read saved data, starting fresh", e);
    db = defaultState();
  }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    catch (e) { toast("Could not save: storage is full or blocked", true); }
  }, 200);
}

function uid() { return SorndiCore.uid(); }

/* ---------------------------------------------------------------- lookups */
const byId = (arr, id) => arr.find(x => x.id === id) || null;
const cls = id => byId(db.classes, id);
const lesson = id => byId(db.lessons, id);
const session = id => byId(db.sessions, id);
const quiz = id => byId(db.quizzes, id);

function classStudents(classId, activeOnly = true) {
  return db.students
    .filter(s => s.classId === classId && (!activeOnly || s.active))
    .sort((a, b) => (a.studentNumber || "").localeCompare(b.studentNumber || "", LANG === "th" ? "th" : "en", { numeric: true }) || a.fullName.localeCompare(b.fullName));
}
function classSessions(classId) {
  return db.sessions.filter(s => s.classId === classId).sort((a, b) => (b.date + (b.startTime || "")).localeCompare(a.date + (a.startTime || "")));
}
function classLessons(classId) {
  return db.lessons.filter(l => l.classId === classId).sort((a, b) => b.createdAt - a.createdAt);
}
function classAssessments(classId) {
  return db.assessments.filter(a => a.classId === classId).sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.createdAt - b.createdAt);
}
function sessionAttendance(sessionId) {
  const map = {};
  for (const r of db.attendance) if (r.sessionId === sessionId) map[r.studentId] = r;
  return map;
}
function allAttendanceForClass(classId) {
  const ids = new Set(db.sessions.filter(s => s.classId === classId).map(s => s.id));
  return db.attendance.filter(r => ids.has(r.sessionId));
}
function getScore(assessmentId, studentId) {
  const r = db.scores.find(s => s.assessmentId === assessmentId && s.studentId === studentId);
  return r ? r.value : null;
}
function slotMinutesFor(classId) {
  const c = cls(classId);
  if (!c || !c.timetable || !c.timetable.length) return null;
  const slots = c.timetable.map(s => {
    if (!s.start || !s.end) return null;
    const [sh, sm] = s.start.split(":").map(Number);
    const [eh, em] = s.end.split(":").map(Number);
    return (eh * 60 + em) - (sh * 60 + sm);
  }).filter(x => x && x > 0);
  return slots.length ? Math.min(...slots) : null;
}
function nextSlotFor(classId, fromISO) {
  const c = cls(classId);
  if (!c || !c.timetable) return null;
  const wd = SorndiCore.weekdayIndex(fromISO);
  return c.timetable.filter(s => s.day === wd).sort((a, b) => (a.start || "").localeCompare(b.start || ""))[0] || null;
}

/* ---------------------------------------------------------------- mutations */
function addAttendance(sessionId, studentId, status, note) {
  const actor = db.settings.teacherName || "Teacher";
  let rec = db.attendance.find(r => r.sessionId === sessionId && r.studentId === studentId);
  if (!rec) {
    rec = { id: uid(), sessionId, studentId, status: null, note: "", history: [] };
    db.attendance.push(rec);
  }
  const changed = rec.status !== status || (note !== undefined && rec.note !== note);
  if (rec.status !== null && rec.status !== status) {
    rec.history.push({ from: rec.status, to: status, actor, at: new Date().toISOString() });
  }
  rec.status = status;
  if (note !== undefined) rec.note = note;
  rec.updatedAt = new Date().toISOString();
  save();
  return changed;
}

/* ---------------------------------------------------------------- toast, dialog */
function toast(msg, isErr) {
  const eld = document.createElement("div");
  eld.className = "toast" + (isErr ? " error" : "");
  eld.textContent = msg;
  document.getElementById("toasts").appendChild(eld);
  setTimeout(() => { eld.style.opacity = "0"; eld.style.transition = "opacity .3s"; }, 2200);
  setTimeout(() => eld.remove(), 2600);
}

function openDialog(title, bodyHTML, footHTML, opts) {
  closeDialog();
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "overlay";
  ov.innerHTML = `<div class="dialog${opts && opts.wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-label="${escAttr(title)}">
    <div class="dialog-head"><h3>${esc(title)}</h3><button class="iconbtn" data-close aria-label="${t("act.close")}">${icon("x")}</button></div>
    <div class="dialog-body">${bodyHTML}</div>
    ${footHTML ? `<div class="dialog-foot">${footHTML}</div>` : ""}
  </div>`;
  ov.addEventListener("click", e => { if (e.target === ov) closeDialog(); });
  document.body.appendChild(ov);
  const f = ov.querySelector("input, select, textarea, button:not([data-close])");
  if (f) f.focus();
  return ov;
}
function closeDialog() { const eld = document.getElementById("overlay"); if (eld) eld.remove(); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDialog();
});

/* ---------------------------------------------------------------- helpers */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escAttr(s) { return esc(s); }

function eld_from(html) { const tpl = document.createElement("template"); tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; }

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ---------------------------------------------------------------- Today */
route(/^\/today$/, () => {
  const todayISOv = SorndiCore.todayISO();
  const wd = SorndiCore.weekdayIndex(todayISOv);

  const todaySessions = db.sessions
    .filter(s => s.date === todayISOv)
    .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));

  const needs = [];
  for (const s of db.sessions) {
    if (s.date >= todayISOv) continue;
    const att = Object.values(sessionAttendance(s.id));
    if (!att.length || att.every(r => !r.status)) {
      needs.push({ kind: "attendance", s });
    } else if (s.status === "completed" && !s.reflection) {
      needs.push({ kind: "reflection", s });
    }
  }
  needs.sort((a, b) => b.s.date.localeCompare(a.s.date));
  needs.splice(8);

  const upcoming = [];
  for (let i = 1; i <= 7 && upcoming.length < 6; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const iso = SorndiCore.todayISO(d);
    for (const c of db.classes.filter(c => !c.archived)) {
      const slot = nextSlotFor(c.id, iso);
      if (slot) upcoming.push({ date: iso, slot, c });
    }
  }
  upcoming.sort((a, b) => a.date.localeCompare(b.date) || (a.slot.start || "").localeCompare(b.slot.start || ""));
  upcoming.splice(6);

  const openRefl = db.sessions.filter(s => s.status === "completed" && !s.reflection).length;

  let html = `
    <div class="page-title">${esc(fmtDateObj(new Date()))}</div>
    <p class="page-sub">${esc(db.settings.teacherName ? `${db.settings.teacherName}${db.settings.school ? " · " + db.settings.school : ""}` : t("today.start"))}</p>`;

  if (!db.classes.length) {
    html += `<div class="card pad section">${emptyState("classes", "today.start",
      esc(t("today.createFirst")),
      `<button class="btn primary" data-go="#/classes">${icon("plus")}${esc(t("classes.new"))}</button>
       <button class="btn" data-action="load-demo" style="margin-left:8px">${esc(t("set.demo"))}</button>`)}</div>`;
  } else {
    html += `<div class="stat-row section">
      <div class="stat"><div class="n">${db.classes.filter(c => !c.archived).length}</div><div class="l">${esc(t("nav.classes"))}</div></div>
      <div class="stat"><div class="n">${db.students.filter(s => s.active).length}</div><div class="l">${esc(t("class.students"))}</div></div>
      <div class="stat"><div class="n">${db.lessons.filter(l => l.status === "ready").length}</div><div class="l">${esc(t("lesson.ready"))}</div></div>
      ${openRefl ? `<div class="stat"><div class="n">${openRefl}</div><div class="l">${esc(t("today.missingReflection"))}</div></div>` : ""}
    </div>`;
  }

  if (db.classes.length) {
    html += `<div class="section">${sectionHead("today.sessions", todaySessions.length || undefined)}`;
    if (!todaySessions.length) {
      html += `<div class="card"><div class="empty" style="padding:28px">${icon("today")}<div class="t">${esc(t("today.noSessions"))}</div><div class="small">${esc(WEEKDAYS[LANG][wd])}</div></div></div>`;
    } else {
      html += `<div class="card">`;
      for (const s of todaySessions) {
        const c = cls(s.classId); const l = s.lessonId ? lesson(s.lessonId) : null;
        const att = Object.values(sessionAttendance(s.id));
        const attCount = att.filter(r => r.status).length;

/* ---------------------------------------------------------------- Overview tab */
function renderClassOverview(root, c) {
  const students = classStudents(c.id);
  const sessions = classSessions(c.id);
  const rate = SorndiCore.attendanceRate(allAttendanceForClass(c.id));
  const lessons = classLessons(c.id);
  const ready = lessons.filter(l => l.status === "ready").length;

  let html = `<div class="stat-row">
    <div class="stat"><div class="n">${students.length}</div><div class="l">${t("class.students")}</div></div>
    <div class="stat"><div class="n">${ready}</div><div class="l">${t("lesson.ready")}</div></div>
    <div class="stat"><div class="n">${sessions.length}</div><div class="l">${t("att.session")}</div></div>
    <div class="stat"><div class="n">${rate === null ? "—" : rate + "%"}</div><div class="l">${t("class.attRate")}</div></div>
  </div>`;

  if (c.timetable && c.timetable.length) {
    html += `<div class="section">${sectionHead("class.timetable", c.timetable.length)}<div class="card">`;
    for (const s of [...c.timetable].sort((a, b) => a.day - b.day || (a.start || "").localeCompare(b.start || ""))) {
      html += `<div style="display:flex;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line)">
        <span class="mono small muted" style="width:36px">${esc(WEEKDAYS_SHORT[LANG][s.day])}</span>
        <span class="mono small">${esc(s.start || "")}–${esc(s.end || "")}</span></div>`;
    }
    html += `</div></div>`;
  }

  html += `<div class="section">${sectionHead("class.recentSessions", sessions.length || undefined)}
    <div class="card">`;
  if (!sessions.length) {
    html += `<div class="empty" style="padding:26px">${icon("clock")}<div class="t">${esc(t("empty.noSessions"))}</div>
      <button class="btn sm" data-action="new-session" data-id="${c.id}">${icon("plus")}${esc(t("att.newSession"))}</button></div>`;
  } else {
    for (const s of sessions.slice(0, 6)) {
      const l = s.lessonId ? lesson(s.lessonId) : null;
      const att = sessionAttendance(s.id);
      const counts = SorndiCore.attendanceSummary(Object.values(att));
      html += `<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer" data-action="go-att" data-session="${s.id}">
        <span class="mono small" style="width:92px">${esc(fmtDateISO(s.date))}</span>
        <span style="flex:1;min-width:0">${l ? esc(l.title) : `<span class="muted">${esc(t("att.session"))}</span>`}</span>
        ${counts.not_recorded ? `<span class="chip mut">${counts.not_recorded} ·</span>` : ""}
        <span class="chip green">${counts.present}</span>
        ${counts.late ? `<span class="chip amber">${counts.late}</span>` : ""}
        ${counts.absent_unexcused + counts.absent_excused ? `<span class="chip red">${counts.absent_unexcused + counts.absent_excused}</span>` : ""}
      </div>`;
    }
  }
  html += `</div></div>`;
  root.innerHTML = html;
}

  `, `<button class="btn primary" id="sf-save">${t("act.save")}</button>`);
  const ov = document.getElementById("overlay");
  ov.querySelector("#sf-save").addEventListener("click", () => {

      studentNumber: ov.querySelector("#sf-num").value.trim(),

function nextStudentNumber(classId) {
  const nums = classStudents(classId, false).map(s => parseInt(s.studentNumber, 10)).filter(n => !isNaN(n));
  return String((nums.length ? Math.max(...nums) : 0) + 1);
}

function importRosterDialog(c) {
  openDialog(t("class.importRoster"), `
    <p class="hint" style="margin-bottom:10px">${t("roster.importHint")}</p>
    <textarea class="input" id="ir-text" rows="9" placeholder="1, Somchai Jaidee\n2, Malee Sookjai\nAnna Wittaya"></textarea>
  `, `<button class="btn primary" id="ir-save">${t("act.add")}</button>`);
  const ov = document.getElementById("overlay");
  ov.querySelector("#ir-save").addEventListener("click", () => {
    const lines = ov.querySelector("#ir-text").value.split("\n").map(l => l.trim()).filter(Boolean);
    let n = 0;
    let next = parseInt(nextStudentNumber(c.id), 10) || 1;
    for (const line of lines) {
      const m = line.match(/^(\d+)\s*[,.:;]?\s*(.+)$/);
      const num = m ? m[1] : String(next);
      const name = (m ? m[2] : line).trim();
      if (!name) continue;
      db.students.push({ id: uid(), classId: c.id, studentNumber: num, fullName: name, notes: "", active: true });
      next = (parseInt(num, 10) || next) + 1;
      n++;
    }
    save(); closeDialog(); renderRoute(); toast(`${n} ${t("class.students")}`);
  });
}

      <button class="btn sm primary" data-action="mark-all" data-session="${s.id}">${icon("check")}${t("att.markAll")}</button>
    </div>
    <div class="attendance-summary" style="padding:10px 16px;border-bottom:1px solid var(--line)" id="att-counts">
      <span class="chip green">${t("st.present")} <span class="mono">${counts.present}</span></span>
      <span class="chip amber">${t("st.late")} <span class="mono">${counts.late}</span></span>
      <span class="chip slate">${t("st.absentExcused")} <span class="mono">${counts.absent_excused}</span></span>
      <span class="chip red">${t("st.absentUnexcused")} <span class="mono">${counts.absent_unexcused}</span></span>
      <span class="chip clay">${t("st.sick")} <span class="mono">${counts.sick}</span></span>

function lessonDialog(c, existing) {
  const templates = SorndiCore.LESSON_TEMPLATES;
  const slotMin = slotMinutesFor(c.id);
  openDialog(existing ? t("act.edit") : t("lesson.new"), `
    <label class="field"><span>Lesson title *</span><input class="input" id="lf-title" value="${escAttr(existing ? existing.title : "")}"></label>
    <label class="field"><span>${t("lesson.objective")} *</span>
      <input class="input" id="lf-objective" value="${escAttr(existing ? existing.objective : "")}" placeholder="Students can…">
      ${existing && existing.objective ? "" : `<div class="hint">${esc(t("warn.noObjective"))}</div>`}
    </label>
    <div class="row">
      <label class="field"><span>${t("lesson.planned")}</span><input class="input" type="date" id="lf-date" value="${escAttr(existing ? existing.plannedDate || "" : "")}"></label>
      <label class="field"><span>${t("lesson.status")}</span>
        <select class="input" id="lf-status">
          ${["draft", "ready", "taught", "cancelled"].map(s => `<option value="${s}" ${existing && existing.status === s ? "selected" : ""}>${t("lesson." + s)}</option>`).join("")}
        </select></label>
    </div>
    <label class="field"><span>${t("lesson.template")}</span>
      <select class="input" id="lf-template">
        <option value="">—</option>
        ${templates.map(tp => `<option value="${tp.id}" ${existing && existing.template === tp.id ? "selected" : ""}>${tp.stages.map(s => s.name).join(" · ")}</option>`).join("")}
      </select>
      <div class="hint">${esc(slotMin ? t("lesson.totalTime") + ": " + slotMin + " min" : "")}</div>
    </label>
    <div id="lf-stages"></div>
  `, `<button class="btn primary" id="lf-save">${t("act.save")}</button>`, { wide: true });
  const ov = document.getElementById("overlay");

  function stageRow(s) {
    const div = eld_from(`<div class="row" style="align-items:center;margin-bottom:6px">
      <input class="input sg-name" style="flex:2" value="${escAttr(s.name || "")}" placeholder="${esc(t("lesson.stages"))}">
      <input class="input sg-min num" style="flex:0 0 76px" type="number" min="0" value="${escAttr(s.minutes ?? "")}">
      <span class="meta">min</span>
      <button class="iconbtn sg-del">${icon("x")}</button>
    </div>`);
    div.querySelector(".sg-del").addEventListener("click", () => { div.remove(); updateTotal(); });
    return div;
  }
  function readStages() {
    return [...ov.querySelectorAll("#lf-stages .row")].map(r => ({
      name: r.querySelector(".sg-name").value.trim(),
      minutes: parseInt(r.querySelector(".sg-min").value, 10) || 0,
    })).filter(s => s.name);
  }
  function updateTotal() {
    const stages = readStages();
    const total = SorndiCore.planTotalMinutes(stages);
    const box = ov.querySelector("#lf-total");
    if (box) box.innerHTML = `<span class="mono">${total}</span> min` + (slotMin && total > slotMin ? ` · <span style="color:var(--amber)">${esc(t("warn.overTime"))}</span>` : "");
  }
  function renderStages(stages) {
    const box = ov.querySelector("#lf-stages");
    box.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <b class="small">${esc(t("lesson.stages"))}</b><span class="meta" id="lf-total"></span></div>`;
    for (const s of stages) box.appendChild(stageRow(s));
    box.insertAdjacentHTML("beforeend", `<button class="btn sm" id="sg-add">${icon("plus")}${t("act.add")}</button>`);
    box.querySelector("#sg-add").addEventListener("click", () => { box.querySelector("#sg-add").before(stageRow({})); updateTotal(); });
    box.addEventListener("input", updateTotal);
    updateTotal();
  }
  if (existing && existing.stages && existing.stages.length) renderStages(existing.stages);
  ov.querySelector("#lf-template").addEventListener("change", e => {
    const stages = SorndiCore.templateStages(e.target.value);
    if (stages) renderStages(stages);
  });
  if (!existing) renderStages([]);
  else updateTotal();

  ov.querySelector("#lf-save").addEventListener("click", () => {
    const title = ov.querySelector("#lf-title").value.trim();
    const objective = ov.querySelector("#lf-objective").value.trim();
    if (!title) { ov.querySelector("#lf-title").focus(); return; }
    const stages = readStages();
    const data = {
      title, objective,
      plannedDate: ov.querySelector("#lf-date").value || null,
      status: ov.querySelector("#lf-status").value,
      template: ov.querySelector("#lf-template").value || null,
      stages,
    };
    if (existing) Object.assign(existing, data);
    else db.lessons.push({ id: uid(), classId: c.id, createdAt: Date.now(), ...data });
    save(); closeDialog(); renderRoute();
  });
}

/* ---------------------------------------------------------------- Scorebook tab */
function renderScorebook(root, c) {
  const students = classStudents(c.id);
  const assessments = classAssessments(c.id);
  const objectives = db.objectives.filter(o => o.classId === c.id);
  let html = `<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
    <button class="btn primary" data-action="new-assessment" data-id="${c.id}">${icon("plus")}${t("score.new")}</button>
    ${assessments.length ? `<button class="btn" data-action="export-scorebook" data-id="${c.id}">${icon("exports")}CSV</button>` : ""}
  </div>`;
  if (!assessments.length) {
    root.innerHTML = html + `<div class="card">${emptyState("scorebook", "empty.noAssessments", esc(t("score.total") + " = Σ(pct × weight) / Σ(weight)"))}</div>`;
    return;
  }

  html += `<div class="card" style="overflow-x:auto"><table class="table"><thead><tr><th style="min-width:150px">${t("roster.name")}</th>`;
  for (const a of assessments) {
    html += `<th title="${esc(a.category || "")}" style="text-align:center;min-width:86px">
      <div style="font-weight:500">${esc(a.name)}</div>
      <div class="meta mono">/${a.maxScore} · w${a.weight}</div></th>`;
  }
  html += `<th style="min-width:110px;text-align:right">${t("score.total")}</th><th style="width:40px"></th></tr></thead><tbody id="sb-rows">`;
  for (const st of students) {
    html += `<tr><td><b>${esc(st.fullName)}</b></td>`;
    for (const a of assessments) {
      const v = getScore(a.id, st.id);
      html += `<td style="text-align:center">
        <input class="input sb-cell" style="width:64px;text-align:center;padding:4px 6px" data-a="${a.id}" data-s="${st.id}" data-max="${a.maxScore}"
          value="${typeof v === "number" ? v : ""}" inputmode="decimal" placeholder="—">
        <div style="display:flex;gap:2px;justify-content:center;margin-top:3px">
          <button class="st-btn ${v === "missing" ? "on red" : ""}" data-flag="missing" data-a="${a.id}" data-s="${st.id}" title="${t("score.missing")}">M</button>
          <button class="st-btn ${v === "excused" ? "on slate" : ""}" data-flag="excused" data-a="${a.id}" data-s="${st.id}" title="${t("score.excused")}">E</button>
        </div></td>`;
    }
    html += `<td style="text-align:right"><span class="mono sb-total" data-s="${st.id}">—</span></td>
      <td><button class="iconbtn" data-math="${st.id}" title="${t("score.showMath")}">${icon("info")}</button></td></tr>`;
  }
  html += `</tbody></table></div>
  <div class="note" style="margin-top:10px">M = ${t("score.missing")} · E = ${t("score.excused")} — ${esc("not zero")}. ${t("score.showMath")} → ${icon("info")}</div>`;
  root.innerHTML = html;
  updateAllTotals(root, c);
  root.querySelector(".card").addEventListener("input", e => {
    const cell = e.target.closest(".sb-cell");
    if (!cell) return;
    const aId = cell.dataset.a, sId = cell.dataset.s, max = Number(cell.dataset.max);
    let val = cell.value.trim();
    if (val === "") {
      db.scores = db.scores.filter(r => !(r.assessmentId === aId && r.studentId === sId));
    } else {
      const num = Number(val);
      if (isNaN(num)) return;
      const clamped = Math.min(Math.max(num, 0), max);
      if (clamped !== num) { cell.value = clamped; }
      setScore(aId, sId, clamped);
    }
    save();
    updateTotalCell(root, c, sId);
    const avgCell = root.querySelector(`.sb-avg[data-a="${aId}"]`);
    if (avgCell) avgCell.textContent = fmtNum(SorndiCore.assessmentStats(db.scores.filter(r => r.assessmentId === aId).map(r => r.value), max).average);
  });
  root.querySelector(".card").addEventListener("click", e => {
    const flag = e.target.closest("[data-flag]");
    if (flag) {
      const aId = flag.dataset.a, sId = flag.dataset.s, kind = flag.dataset.flag;
      const cur = getScore(aId, sId);
      setScore(aId, sId, cur === kind ? null : kind);
      save(); renderScorebook(root, c);
      return;
    }
    const mathBtn = e.target.closest("[data-math]");
    if (mathBtn) showCalculation(c, mathBtn.dataset.math);
  });
}

function setScore(assessmentId, studentId, value) {
  let r = db.scores.find(s => s.assessmentId === assessmentId && s.studentId === studentId);
  if (value === null) {
    if (r) db.scores.splice(db.scores.indexOf(r), 1);
    return;
  }
  if (!r) { r = { assessmentId, studentId }; db.scores.push(r); }
  r.value = value;
}

function fmtNum(n) {
  return n === null || n === undefined ? "—" : (Math.round(n * 10) / 10).toFixed(1);
}

function updateTotalCell(root, c, studentId) {
  const assessments = classAssessments(c.id);
  const wt = SorndiCore.weightedTotal(assessments, studentId, getScore);
  const cell = root.querySelector(`.sb-total[data-s="${studentId}"]`);
  if (cell) cell.textContent = wt.total === null ? "—" : Math.round(wt.total) + "%";
}

function updateAllTotals(root, c) {
  for (const st of classStudents(c.id)) updateTotalCell(root, c, st.id);
  // class average row per assessment in header is optional; show averages under header via title
}

function showCalculation(c, studentId) {
  const st = byId(db.students, studentId);
  const assessments = classAssessments(c.id);
  const wt = SorndiCore.weightedTotal(assessments, studentId, getScore);
  let rows = wt.included.map(inc => {
    const a = byId(assessments, inc.assessmentId);
    return `${a.name.padEnd(22)} ${String(Math.round(inc.pct)).padStart(3)}%  × w${inc.weight}  →  ${(Math.round(inc.contribution * 10) / 10).toFixed(1)}`;
  }).join("\n");
  if (wt.missing) rows += `\n${t("score.missing")}: ${wt.missing} (excluded)`;
  if (wt.excused) rows += `\n${t("score.excused")}: ${wt.excused} (excluded)`;
  openDialog(`${t("score.formulaTitle")} — ${st ? st.fullName : ""}`, `
    <div class="formula">total = Σ(pct × weight) / Σ(weight)

${rows}

Σ(weight) = ${wt.weightSum}
total = ${wt.total === null ? "—" : (Math.round(wt.total * 10) / 10).toFixed(1) + "%"}</div>
    <p class="hint" style="margin-top:10px">${t("score.missing")}/${t("score.excused")} ≠ 0</p>
  `, `<button class="btn" data-close>${t("act.close")}</button>`);
}

  function key(sessionId, stId, fId) { return `${sessionId}|${stId}|${fId}`; }
  function existing(sessionId, stId, fId) {
    return db.recordEntries.find(r => r.templateId === tp.id && r.sessionId === sessionId && r.studentId === stId && r.fieldId === fId);
  }
  function applyAbsenceDefaults(sessionId) {
    const s = session(sessionId);
    if (!s) return;
    const att = sessionAttendance(sessionId);
    for (const st of students) {
      const status = att[st.id] && att[st.id].status;
      if (status && status !== "present" && status !== "remote" && status !== "late") {
        for (const f of tp.fields) {
          if (f.kind === "check" && !existing(sessionId, st.id, f.id)) {
            db.recordEntries.push({ id: uid(), templateId: tp.id, sessionId, studentId: st.id, fieldId: f.id, value: "NA", auto: true, at: new Date().toISOString() });
          }
        }
      }
    }
  }
  function refreshMarks(sessionId) {
    ov.querySelectorAll("[data-re]").forEach(btn => {
      const [stId, fId] = btn.dataset.re.split("|");
      btn.classList.toggle("on", !!existing(sessionId, stId, fId) && existing(sessionId, stId, fId).value === "✓");
      btn.textContent = existing(sessionId, stId, fId) && existing(sessionId, stId, fId).value === "NA" ? "—" : "✓";
    });
    ov.querySelectorAll("[data-re-cell]").forEach(inp => {
      const [stId, fId] = inp.dataset.reCell.split("|");
      const r = existing(sessionId, stId, fId);
      if (r && document.activeElement !== inp) inp.value = r.value;
    });
  }
  if (sessionIdSel) {
    sessionIdSel.addEventListener("change", () => { applyAbsenceDefaults(sessionIdSel.value); refreshMarks(sessionIdSel.value); });
    applyAbsenceDefaults(sessionIdSel.value);
    refreshMarks(sessionIdSel.value);
    ov.addEventListener("click", e => {
      const btn = e.target.closest("[data-re]");
      if (!btn) return;
      const [stId, fId] = btn.dataset.re.split("|");
      const sessionId = sessionIdSel.value;
      const r = existing(sessionId, stId, fId);
      if (!r) db.recordEntries.push({ id: uid(), templateId: tp.id, sessionId, studentId: stId, fieldId: fId, value: "✓", at: new Date().toISOString() });
      else if (r.value === "✓") r.value = "NA";
      else db.recordEntries.splice(db.recordEntries.indexOf(r), 1);
      save(); refreshMarks(sessionId);
    });
    ov.addEventListener("input", e => {
      const inp = e.target.closest("[data-re-cell]");
      if (!inp) return;
      const [stId, fId] = inp.dataset.reCell.split("|");
      const sessionId = sessionIdSel.value;
      let r = existing(sessionId, stId, fId);
      if (!r) { r = { id: uid(), templateId: tp.id, sessionId, studentId: stId, fieldId: fId, at: new Date().toISOString() }; db.recordEntries.push(r); }
      r.value = inp.value;
      save();
    });
  }
}

function runnerShell(inner) {
  const q = runner.quiz;
  return `<div class="quiz-stage">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
      <button class="iconbtn" data-action="run-exit" aria-label="${t("act.close")}">${icon("x")}</button>
      <div class="mono muted">Q${runner.idx + 1}/${q.questions.length}</div>
      <div class="timer-bar" style="flex:1"><div id="timer-fill" style="width:100%"></div></div>
      <button class="btn sm" data-action="run-mode-switch">${runner.mode === "projector" ? t("quiz.shared") : t("quiz.projector")}</button>
    </div>
    ${inner}
  </div>`;
}

function renderQuestion() {
  const q = runner.quiz;
  const qq = q.questions[runner.idx];
  const main = document.getElementById("view");
  if (runner.mode === "projector") {
    main.innerHTML = `<div class="view">${runnerShell(`
      <div class="quiz-q serif">${esc(qq.prompt)}</div>
      <div class="quiz-opts">
        ${qq.options.map((o, oi) => o ? `<button class="quiz-opt ${runner.revealed && oi === qq.correct ? "correct" : ""}" data-tally="${oi}">
          <span class="key">${"ABCD"[oi]}</span><span>${esc(o)}</span>
          ${runner.revealed ? `<span class="tally mono">${runner.tallies[runner.idx][oi]}</span>` : `<span class="tally mono muted">${runner.tallies[runner.idx][oi] || ""}</span>`}
        </button>` : "").join("")}
      </div>
      ${runner.revealed ? `<div class="card pad" style="margin-top:18px"><b>${esc(qq.options[qq.correct] || "")}</b><p class="small muted" style="margin-top:4px">${esc(qq.explanation || "")}</p></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn primary" data-action="run-next">${runner.idx + 1 < q.questions.length ? t("quiz.next") : t("quiz.finish")}${icon("arrowR")}</button>
        </div>` : `<div style="display:flex;gap:8px;margin-top:22px">
        <button class="btn primary" data-action="run-reveal">${icon("check")}${t("quiz.reveal")}</button>
        <span class="meta" style="align-self:center">${esc(t("quiz.tapTally"))}</span></div>`}
    `)}</div>`;
  } else {
    // shared device: teams answer in turn
    const teams = runner.teams;
    main.innerHTML = `<div class="view">${runnerShell(`
      <div class="quiz-q serif">${esc(qq.prompt)}</div>
      <div class="meta" style="margin-top:8px">${esc(teams[runner.teamIdx].name)}</div>
      <div class="quiz-opts">
        ${qq.options.map((o, oi) => o ? `<button class="quiz-opt ${runner.revealed && oi === qq.correct ? "correct" : ""}" data-answer="${oi}">
          <span class="key">${"ABCD"[oi]}</span><span>${esc(o)}</span>
        </button>` : "").join("")}
      </div>
      ${runner.revealed ? `<div class="card pad" style="margin-top:18px"><b>${esc(qq.options[qq.correct] || "")}</b><p class="small muted" style="margin-top:4px">${esc(qq.explanation || "")}</p></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn primary" data-action="run-next">${runner.idx + 1 < q.questions.length ? t("quiz.next") : t("quiz.finish")}${icon("arrowR")}</button>
        </div>` : `<div class="meta" style="margin-top:18px">${esc("The team taps its answer, then pass the device on.")}</div>`}
    `)}</div>`;
  }
  startTimer();
}

function startTimer() {
  stopTimer();
  const q = runner.quiz;
  const qq = q.questions[runner.idx];
  if (!qq || runner.revealed) { updateTimerBar(0); return; }
  runner.timeLeft = q.seconds || 30;
  updateTimerBar(1);
  runner.timer = setInterval(() => {
    runner.timeLeft--;
    updateTimerBar(runner.timeLeft / (q.seconds || 30));
    if (runner.timeLeft <= 0) { stopTimer(); if (runner.mode === "projector") doReveal(); }
  }, 1000);
}
function stopTimer() { if (runner && runner.timer) { clearInterval(runner.timer); runner.timer = null; } }
function updateTimerBar(frac) {
  const fill = document.getElementById("timer-fill");
  if (fill) fill.style.width = Math.max(0, Math.min(1, frac)) * 100 + "%";
}
function doReveal() {
  if (!runner) return;
  runner.revealed = true;
  stopTimer();
  renderQuestion();
}

function finishRun() {
  stopTimer();
  const q = runner.quiz;
  const results = q.questions.map((qq, i) => {
    const tally = runner.tallies[i];
    const totalAnswers = tally.reduce((s, n) => s + n, 0);
    return { prompt: qq.prompt, correct: qq.correct, options: qq.options, tally, totalAnswers, correctPct: totalAnswers ? Math.round((tally[qq.correct] || 0) / totalAnswers * 100) : null };
  });
  if (runner.mode === "shared" && runner.teams) {
    openDialog(t("quiz.results"), `
      <div class="card"><table class="table"><thead><tr><th>#</th><th>${t("tools.teams")}</th><th style="text-align:right">${t("quiz.correct")}</th></tr></thead><tbody>
      ${runner.teams.map((tm, i) => `<tr><td class="mono">${i + 1}</td><td>${esc(tm.name)}</td><td class="mono" style="text-align:right">${tm.score}/${tm.answered || 0}</td></tr>`).join("")}
      </tbody></table></div>`, `<button class="btn primary" id="qr-save">${t("quiz.saveRun")}</button>`);
  } else {
    openDialog(t("quiz.results"), `
      ${results.map((r, i) => `<div style="margin-bottom:14px">
        <div class="small" style="margin-bottom:4px"><b class="mono">Q${i + 1}</b> ${esc(r.prompt)}</div>

function exportAttendanceCSV(classId) {
  const c = cls(classId); if (!c) return;
  const students = classStudents(classId, false);
  const sessions = [...classSessions(classId)].sort((a, b) => a.date.localeCompare(b.date));
  const rows = [];
  for (const s of sessions) {
    const att = sessionAttendance(s.id);
    for (const st of students) {
      const r = att[st.id];
      rows.push([s.date, s.startTime || "", c.name, (s.lessonId && lesson(s.lessonId)) ? lesson(s.lessonId).title : "", st.studentNumber, st.fullName, r ? r.status : "not_recorded", r ? r.note || "" : ""]);
    }
  }
  downloadFile(`sorndi-attendance-${slug(c.name)}.csv`,
    SorndiCore.toCSV(["date", "time", "class", "lesson", "student_number", "student", "status", "note"], rows));
  toast(t("exported"));
}

function exportScorebookCSV(classId) {
  const c = cls(classId); if (!c) return;
  const students = classStudents(classId, false);
  const assessments = classAssessments(classId);
  const headers = ["student_number", "student", ...assessments.flatMap(a => [`${a.name} (${a.maxScore},w${a.weight})`, "state"]), "weighted_total"];
  const rows = students.map(st => {
    const wt = SorndiCore.weightedTotal(assessments, st.id, getScore);
    const cells = [];
    for (const a of assessments) {
      const v = getScore(a.id, st.id);
      cells.push(typeof v === "number" ? v : "");
      cells.push(typeof v === "number" ? "scored" : v || "");
    }
    return [st.studentNumber, st.fullName, ...cells, wt.total === null ? "" : Math.round(wt.total * 10) / 10];
  });
  downloadFile(`sorndi-scorebook-${slug(c.name)}.csv`, SorndiCore.toCSV(headers, rows));
  toast(t("exported"));
}

function runTimer() {
  const d = document.getElementById("timer-display");
  if (!d) return;
  if (timerState) {
    if (timerState.running) {
      timerState.left = Math.max(0, timerState.left - 1);
      const m = String(Math.floor(timerState.left / 60)).padStart(2, "0");
      const s = String(timerState.left % 60).padStart(2, "0");
      d.textContent = `${m}:${s}`;
      d.style.color = timerState.left === 0 ? "var(--red)" : "";
      if (timerState.left === 0) { timerState = null; d.textContent = "00:00"; return; }
    }
    setTimeout(runTimer, 1000);
  }
}

  "edit-class": el => classDialog(cls(el.dataset.id)),
  "unarchive-class": el => { const c = cls(el.dataset.id); if (c) c.archived = false; save(); renderRoute(); },
  "add-student": el => studentDialog(cls(el.dataset.id), null),
  "import-roster": el => importRosterDialog(cls(el.dataset.id)),
  "edit-student": el => {
    const s = byId(db.students, el.dataset.id);
    if (s) studentDialog(cls(s.classId), s);
  },
  "del-student": el => {
    const s = byId(db.students, el.dataset.id);
    if (s && confirm(`${t("act.delete")}: ${s.fullName}?`)) { db.students.splice(db.students.indexOf(s), 1); save(); renderRoute(); }
  },
  "new-session": el => sessionDialog(cls(el.dataset.id)),
  "go-att": el => {
    const s = session(el.dataset.session);
    if (!s) return;
    location.hash = `#/class/${s.classId}/attendance`;
    sessionStorage.setItem("sorndi.session", s.id);
    setTimeout(() => {
      const sel = document.getElementById("att-session");
      if (sel) { sel.value = s.id; sel.dispatchEvent(new Event("change")); }
    }, 80);
  },
  "open-lesson": el => { const l = lesson(el.dataset.id); if (l) lessonDialog(cls(l.classId), l); },
  "new-lesson": el => lessonDialog(cls(el.dataset.id), null),
  "edit-lesson": el => { const l = lesson(el.dataset.id); if (l) lessonDialog(cls(l.classId), l); },
  "del-lesson": el => {
    const l = lesson(el.dataset.id);
    if (l && confirm(`${t("act.delete")}: ${l.title}?`)) { db.lessons.splice(db.lessons.indexOf(l), 1); save(); renderRoute(); }
  },
  "new-session-for-lesson": el => {
    const l = lesson(el.dataset.lesson);
    if (!l) return;
    const s = { id: uid(), classId: l.classId, lessonId: l.id, date: l.plannedDate || SorndiCore.todayISO(), startTime: "", status: "planned", reflection: "", nextAction: "", createdAt: Date.now() };
    db.sessions.push(s); save();
    location.hash = `#/class/${l.classId}/attendance`;
    sessionStorage.setItem("sorndi.session", s.id);
    setTimeout(() => {
      const sel = document.getElementById("att-session");
      if (sel) { sel.value = s.id; sel.dispatchEvent(new Event("change")); }
    }, 80);
  },
  "mark-all": el => {
    const sId = el.dataset.session;
    const s = session(sId);
    const students = classStudents(s.classId);
    for (const st of students) addAttendance(sId, st.id, "present");
    renderRoute();
    const root2 = document.getElementById("att-area");
    if (root2) renderAttendanceRows(root2, s ? cls(s.classId) : null, sId);
  },
  "new-assessment": el => assessmentDialog(cls(el.dataset.id)),
  "export-scorebook": el => exportScorebookCSV(el.dataset.id),
  "new-template": el => templateDialog(cls(el.dataset.id)),
  "del-template": el => {
    const tp = byId(db.recordTemplates, el.dataset.id);
    if (tp && confirm(`${t("act.delete")}: ${tp.name}?`)) { db.recordTemplates.splice(db.recordTemplates.indexOf(tp), 1); save(); renderRoute(); }
  },
  "open-record-entry": el => recordEntryDialog(byId(db.recordTemplates, el.dataset.id)),
  "studio-tab": el => {
    document.querySelectorAll("[data-action='studio-tab']").forEach(b => b.classList.toggle("active", b === el));
    renderStudioTab(document.getElementById("studio-tab"), el.dataset.tab);
  },
  "studio-new-lesson": () => studioLessonDialog(null),
  "studio-edit-lesson": el => studioLessonDialog(lesson(el.dataset.id)),
  "new-quiz": () => quizDialog(null),
  "edit-quiz": el => quizDialog(quiz(el.dataset.id)),
  "del-quiz": el => {
    const q = quiz(el.dataset.id);
    if (q && confirm(`${t("act.delete")}: ${q.title}?`)) { db.quizzes.splice(db.quizzes.indexOf(q), 1); save(); renderRoute(); }
  },
  "run-quiz": el => { location.hash = `#/run/${el.dataset.id}`; },
  "run-mode": el => {
    if (!runner) return;
    runner.mode = el.dataset.mode;
    if (runner.mode === "shared") {
      const students = classStudents(runner.quiz.classId);
      if (!students.length) { toast(t("class.students") + " — 0", true); return; }
      runner.teams = students.map((s, i) => ({ name: `${t("tools.teams")} ${Math.floor(i / 3) + 1} · ${s.fullName.split(" ")[0]}`, studentId: s.id, score: 0, answered: 0 }));
      runner.teamIdx = 0;
    }
    renderQuestion();
  },
  "run-mode-switch": () => {
    if (!runner) return;
    const btn = document.querySelector("[data-action='run-mode-switch']");
    runner.mode = runner.mode === "projector" ? "shared" : "projector";
    if (runner.mode === "shared" && !runner.teams) {
      const students = classStudents(runner.quiz.classId);
      runner.teams = students.map((s, i) => ({ name: `${t("tools.teams")} ${Math.floor(i / 3) + 1} · ${s.fullName.split(" ")[0]}`, studentId: s.id, score: 0, answered: 0 }));
      runner.teamIdx = 0;
    }
    runner.revealed = false;
    renderQuestion();
  },
  "run-reveal": () => doReveal(),
  "run-next": () => {
    if (!runner) return;
    if (runner.idx + 1 < runner.quiz.questions.length) { runner.idx++; runner.revealed = false; renderQuestion(); }
    else finishRun();
  },
  "run-exit": () => { stopTimer(); runner = null; location.hash = "#/studio"; },
  "tool-pick": () => {
    const sel = document.getElementById("pick-class");
    const out = document.getElementById("pick-name");
    const students = classStudents(sel.value);
    if (!students.length) { out.textContent = "—"; return; }
    let picked = pickState[sel.value] || [];
    if (picked.length >= students.length) picked = [];
    const remaining = students.filter(s => !picked.includes(s.id));
    const chosen = remaining[Math.floor(Math.random() * remaining.length)];
    picked.push(chosen.id);
    pickState[sel.value] = picked;
    out.textContent = chosen.fullName;
    updatePickLeft();
  },
  "tool-pick-reset": () => {
    const sel = document.getElementById("pick-class");
    pickState[sel.value] = [];
    document.getElementById("pick-name").textContent = "—";
    updatePickLeft();
  },
  "tool-teams": () => {
    const sel = document.getElementById("teams-class");
    const n = Math.max(2, Number(document.getElementById("teams-n").value) || 4);
    const students = classStudents(sel.value);
    const shuffled = [...students].sort(() => Math.random() - 0.5);
    const teams = Array.from({ length: n }, () => []);
    shuffled.forEach((s, i) => teams[i % n].push(s));
    teamsState = teams;
    document.getElementById("teams-out").innerHTML = teams.map((tm, i) =>
      `<div style="margin-top:10px"><b>${t("tools.teams")} ${i + 1}</b> <span class="meta mono">${tm.length}</span><br>${tm.map(s => esc(s.fullName)).join(", ")}</div>`).join("");
  },
  "timer-start": () => {
    const min = Number(document.getElementById("timer-min").value) || 5;
    timerState = { total: min * 60, left: min * 60, running: true };
    document.getElementById("timer-pausebtn").textContent = t("tools.pause");
    runTimer();
  },
  "timer-pause": () => {
    if (!timerState) return;
    timerState.running = !timerState.running;
    document.getElementById("timer-pausebtn").textContent = timerState.running ? t("tools.pause") : t("tools.resume");
  },
  "timer-reset": () => {
    timerState = null;
    const d = document.getElementById("timer-display");
    if (d) d.textContent = "00:00";
  },
  "st-save": () => {
    db.settings.teacherName = document.getElementById("st-teacher").value.trim();
    db.settings.school = document.getElementById("st-school").value.trim();
    const newLang = document.getElementById("st-lang").value;
    db.settings.theme = document.getElementById("st-theme").value;
    save();
    if (newLang !== LANG) { setLang(newLang); renderShell(); }
    applyTheme();
    toast(t("saved"));
    renderRoute();
  },
  "ex-attendance": () => exportAttendanceCSV(exportClassId()),
  "ex-scorebook": () => exportScorebookCSV(exportClassId()),
  "ex-log": () => exportDailyLogMD(exportClassId()),
  "ex-report": () => printReport(exportClassId()),
  "ex-quizrun": el => exportQuizRunCSV(el.dataset.id),
  "ex-backup": () => {
    downloadFile(`sorndi-backup-${SorndiCore.todayISO()}.json`, JSON.stringify(db, null, 2), "application/json");
    toast(t("exported"));
  },
  "ex-restore": () => document.getElementById("restore-file").click(),
  "ex-wipe": () => {
    const txt = prompt(t("confirm.wipe"));
    if (txt && txt.trim().toUpperCase() === "ERASE") {
      localStorage.removeItem(STORE_KEY);
      db = defaultState();
      toast(t("exports.wipe"));
      location.hash = "#/today";
      renderRoute();
    }
  },
};

document.addEventListener("click", e => {
  // actions
  const act = e.target.closest("[data-action]");
  if (act && ACTIONS[act.dataset.action]) { e.preventDefault(); ACTIONS[act.dataset.action](act); return; }
  // quiz tally (projector)
  const tally = e.target.closest("[data-tally]");
  if (tally && runner) {
    const oi = Number(tally.dataset.tally);
    runner.tallies[runner.idx][oi]++;
    tally.querySelector(".tally").textContent = runner.tallies[runner.idx][oi];
    return;
  }
  // shared-device answer
  const ans = e.target.closest("[data-answer]");
  if (ans && runner && !runner.revealed) {
    const oi = Number(ans.dataset.answer);
    const qq = runner.quiz.questions[runner.idx];
    const team = runner.teams[runner.teamIdx];
    team.answered = (team.answered || 0) + 1;
    if (oi === qq.correct) team.score++;
    runner.tallies[runner.idx][oi]++;
    runner.teamIdx = (runner.teamIdx + 1) % runner.teams.length;
    doReveal();
    return;
  }
  // attendance status
  const stBtn = e.target.closest("[data-att]");
  if (stBtn) {
    const statusId = stBtn.dataset.att, studentId = stBtn.dataset.student, sessionId = stBtn.dataset.session;
    addAttendance(sessionId, studentId, statusId);
    const row = stBtn.closest("tr");
    const rec = sessionAttendance(sessionId)[studentId];
    const st = byId(db.students, studentId);
    row.outerHTML = attendanceRowHTML(sessionId, st, rec);
    const root2 = document.getElementById("att-area");
    if (root2) updateAttendanceCounters(root2, sessionId, clsOfSession(sessionId));
    return;
  }
  // attendance history toggle
  const hist = e.target.closest("[data-att-history]");
  if (hist) {
    const panel = hist.closest("td").querySelector(".att-history");
    if (panel) panel.style.display = panel.style.display === "none" ? "block" : "none";
    return;
  }
  // scorebook cell handled by input listener in view
});

function clsOfSession(sessionId) {
  const s = session(sessionId);
  return s ? s.classId : null;
}

/* attendance note input + keyboard shortcuts */
document.addEventListener("input", e => {
  const note = e.target.closest("[data-att-note]");
  if (note) {
    const sessionId = note.dataset.session, studentId = note.dataset.attNote;
    addAttendance(sessionId, studentId, (sessionAttendance(sessionId)[studentId] || {}).status || null, note.value);
    return;
  }
});
document.addEventListener("keydown", e => {
  const row = e.target.closest && e.target.closest("tr[data-row]");
  if (!row || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { p: "present", l: "late", a: "absent_unexcused", e: "absent_excused", s: "sick", r: "remote" };
  const k = e.key.toLowerCase();
  if (map[k]) {
    const studentId = row.dataset.row;
    const sessionIdEl = document.querySelector("#att-session");
    const sessionEl = document.querySelector("[data-att]");
    const sessionId = sessionEl ? sessionEl.dataset.session : null;
    if (sessionId) {
      addAttendance(sessionId, studentId, map[k]);
      const rec = sessionAttendance(sessionId)[studentId];
      const st = byId(db.students, studentId);
      row.outerHTML = attendanceRowHTML(sessionId, st, rec);
      const root2 = document.getElementById("att-area");
      if (root2) updateAttendanceCounters(root2, sessionId, clsOfSession(sessionId));
    }
  }
});

/* restore file input */
document.addEventListener("change", e => {
  if (e.target && e.target.id === "restore-file" && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || parsed.version !== 2) throw new Error("not a SornDi v2 backup");
        db = Object.assign(defaultState(), parsed);
        save(); toast(t("restored")); renderShell(); renderRoute();
      } catch (err) { toast("Invalid backup file", true); }
    };
    reader.readAsText(f);
    e.target.value = "";
  }
});

/* topbar buttons */
document.getElementById("langbtn").addEventListener("click", () => {
  setLang(LANG === "en" ? "th" : "en");
  db.settings.lang = LANG; save();
  renderShell(); renderRoute();
});
document.getElementById("themebtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  db.settings.theme = cur === "dark" ? "light" : "dark";
  save(); applyTheme(); renderShell();
});

/* keyboard: sessions preselect after route is handled via sessionStorage in go-att */

/* ---------------------------------------------------------------- init */
load();
setLang(db.settings.lang);
applyTheme();
renderShell();
renderRoute();
window.addEventListener("beforeunload", () => { clearTimeout(saveTimer); try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} });

</script>
</body>
